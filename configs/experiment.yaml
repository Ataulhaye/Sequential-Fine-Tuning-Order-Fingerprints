# ============================================================
# Sequential Fine-Tuning Order Fingerprints
# Experiment Configuration
# ============================================================

seed: 42

# ============================================================
# Path Definitions (YAML format)
# ============================================================

paths:
  project_root: "."
  checkpoint_root: "./checkpoints/sequential"
  result_root: "./results/sequential"
  data_root: "./data"
  single_checkpoints: "./checkpoints/single"
  sequential_checkpoints: "./checkpoints/sequential"
  results: "./results"
  figures: "./figures"

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------

dataset:
  name: CIFAR100
  root: ./data

# ------------------------------------------------------------
# Tasks
# ------------------------------------------------------------

tasks:

  A:
    - beaver
    - dolphin
    - otter
    - seal
    - whale

  B:
    - clock
    - keyboard
    - lamp
    - telephone
    - television

  C:
    - bicycle
    - bus
    - motorcycle
    - pickup_truck
    - train

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------

model:
  architecture: resnet18
  pretrained: false
  num_classes: 5

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------

training:

  # Local smoke-test value.
  # This will be increased on the university server.
  epochs_per_task: 10

  batch_size: 128

  optimizer: SGD

  learning_rate: 0.01

  momentum: 0.9

  weight_decay: 0.0005

  num_workers: 2

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------

experiment:

  # Single order used for quick testing.
  # This does NOT define the complete experiment matrix.
  #order: ["A", "B", "C"]

  sequential_orders:

    - [A, B, C]
    - [A, C, B]
    - [B, A, C]
    - [B, C, A]
    - [C, A, B]
    - [C, B, A]


representation:
  probe:
    # true: use the existing fixed probe; false: use all project-class test images.
    enabled: true
    type: "all_project_classes"
    samples_per_class: 20
    # Independent seed controlling which fixed test images
    # are selected for representation analysis.
    seed: 42
    batch_size: 128
    num_workers: 2

  cka:
    kernel: "linear"

  feature_drift:
    normalization: "relative_frobenius"

# ------------------------------------------------------------
# Advanced Analysis
# ------------------------------------------------------------

analysis:
  loss_barrier:
    # Number of interpolation points between reference and sequential weights.
    num_points: 11

  jacobian:
    # Maximum number of test images analyzed per model and task.
    max_samples: 100

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------

paths:

  single_checkpoints: ./checkpoints/single

  sequential_checkpoints: ./checkpoints/sequential

  results: ./results

  figures: ./figures