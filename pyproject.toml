[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-finetuning-order-fingerprints"
version = "0.1.0"
description = "Sequential fine-tuning order fingerprints using ResNet18 on CIFAR-100"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]