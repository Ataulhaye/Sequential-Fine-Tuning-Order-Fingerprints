# ============================================================
# Sequential Fine-Tuning Order Fingerprints
# Experiment Configuration
# ============================================================

seed: 42

# ============================================================
# Path Definitions (YAML format)
# ============================================================

paths:
  project_root: "."
  initialization_checkpoint: "./checkpoints/verified_initialization/base_model.pt"
  checkpoint_root: "./checkpoints/verified_initialization/sequential"
  result_root: "./results/sequential"
  data_root: "./data"
  single_checkpoints: "./checkpoints/verified_initialization/single"
  sequential_checkpoints: "./checkpoints/verified_initialization/sequential"
  results: "./results"
  figures: "./figures"

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------

dataset:
  name: CIFAR100
  root: ./data

# ------------------------------------------------------------
# Tasks
# ------------------------------------------------------------

tasks:

  A:
    - beaver
    - dolphin
    - otter
    - seal
    - whale

  B:
    - clock
    - keyboard
    - lamp
    - telephone
    - television

  C:
    - bicycle
    - bus
    - motorcycle
    - pickup_truck
    - train

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------

model:
  architecture: resnet18
  pretrained: false
  num_classes: 5

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------

training:

  # Local smoke-test value.
  # This will be increased on the university server.
  epochs_per_task: 20

  batch_size: 128

  optimizer: SGD

  learning_rate: 0.01

  momentum: 0.9

  weight_decay: 0.0005

  num_workers: 2

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------

experiment:

  # Single order used for quick testing.
  # This does NOT define the complete experiment matrix.
  #order: ["A", "B", "C"]

  sequential_orders:

    - [A, B, C]
    - [A, C, B]
    - [B, A, C]
    - [B, C, A]
    - [C, A, B]
    - [C, B, A]


representation:
  probe:
    # true: use the existing fixed probe; false: use all project-class test images.
    enabled: false
    type: "all_project_classes"
    samples_per_class: 20
    # Independent seed controlling which fixed test images
    # are selected for representation analysis.
    seed: 40
    batch_size: 128
    num_workers: 2

  cka:
    kernel: "linear"

  feature_drift:
    normalization: "relative_frobenius"

# ------------------------------------------------------------
# Advanced Analysis
# ------------------------------------------------------------

analysis:
  loss_barrier:
    enabled: false
    # Number of interpolation points between reference and sequential weights.
    num_points: 11

  jacobian:
    enabled: false
    # Maximum number of test images analyzed per model and task.
    max_samples: 100

  fisher:
    enabled: true
    # Samples per task used for the Fisher trace estimate.
    num_samples: 1000
    # CIFAR-100 split the samples are drawn from: train or test.
    split: train
    # Controls sample selection and the label sampling; independent of training.
    seed: 42
    # Only affects loading; gradients are always computed per single sample.
    batch_size: 32

  weight_matching:
    enabled: true
    # Maximum coordinate-descent sweeps over the permutation groups.
    max_iterations: 100
    # Controls the random visiting order of the permutation groups.
    seed: 42
    # Images used to verify that permuting neurons leaves outputs unchanged.
    verification_samples: 128
    verification_tolerance: 1.0e-4

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------

paths:

  initialization_checkpoint: ./checkpoints/verified_initialization/base_model.pt

  single_checkpoints: ./checkpoints/verified_initialization/single

  sequential_checkpoints: ./checkpoints/verified_initialization/sequential

  results: ./results

  figures: ./figures